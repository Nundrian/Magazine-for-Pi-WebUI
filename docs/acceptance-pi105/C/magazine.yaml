schema_version: '1.0'
name: Pi 10.5 Acceptance C
handover_mode: result_file_v1
recovery:
  max_attempts: 2
  attempt_seconds: 300
cartridges:
- id: c01
  model: acceptance
  prompt: Use the write tool to put exactly 'C c01' followed by one newline into c01.txt
    in the designated output folder. Use the read tool to confirm the content. Publish
    verified=true, files=["c01.txt"], note="C c01", and the checks you actually performed.
  retry_safe: true
  artifacts:
    outputs:
    - c01.txt
- id: c02
  model: acceptance
  prompt: Read the verified input file c01.txt and confirm that it contains C c01.
